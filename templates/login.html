<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 - NKAMG Scanner</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<nav class="topbar">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 3.5v5.2c0 5-3.4 9.6-8 11.3-4.6-1.7-8-6.3-8-11.3V5.5L12 2z"/>
          <path d="M8.5 12l2.4 2.4 4.6-4.8"/>
        </svg>
      </span>
      NKAMG <em>Scanner</em>
    </a>
    <div class="nav-links">
      <a href="/">搜索</a>
      <a href="/admin/hash">管理</a>
    </div>
    <div class="nav-right"></div>
  </div>
</nav>

<div class="container">
  <!-- ================= 登录卡片 ================= -->
  <form class="login-wrap login-card" method="post" action="{{ request.full_path }}">
    <h1>管理员登录</h1>
    <div class="sub">登录后可管理哈希签名库 · 检测功能无需登录</div>
    {% if error %}<div class="login-err">{{ error }}</div>{% endif %}
    <div class="field">
      <label>用户名</label>
      <input name="username" value="{{ username or '' }}" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%">登录</button>
    <div class="login-hint">
      首次登录使用默认凭据，详见 config.json 的 <b>admin</b> 段（初始用户名 admin，密码 admin123，请尽快修改）<br>
      <a href="/">返回检测首页</a>
    </div>
  </form>
</div>

</body>
</html>
