<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫描 - NKREPO Scanner</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<nav class="topbar">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 3.5v5.2c0 5-3.4 9.6-8 11.3-4.6-1.7-8-6.3-8-11.3V5.5L12 2z"/>
          <path d="M8.5 12l2.4 2.4 4.6-4.8"/>
        </svg>
      </span>
      NKREPO <em>Scanner</em>
    </a>
    <div class="nav-links">
      <a href="/">搜索</a>
      <a href="/scan" class="active">扫描</a>
      <a href="/#stats">统计</a>
      <a href="https://www.clamav.net" target="_blank" rel="noopener">ClamAV 格式</a>
    </div>
    <div class="nav-right">
      <span class="engine-pill" id="enginePill"><span class="dot"></span><span id="engineText">引擎加载中…</span></span>
    </div>
  </div>
</nav>

<div class="container">

  <!-- ================= Hero ================= -->
  <section class="hero">
    <h1>扫描<span class="grad">文件</span>以检测恶意软件</h1>
    <div class="hero-sub">本地静态扫描 · 哈希签名库（ClamAV HDB）+ YARA 规则 + PE 静态分析</div>
  </section>

  <!-- ================= 扫描选项条 (VT 风格 FILE / URL / SEARCH) ================= -->
  <div class="scan-opts">
    <button class="scan-opt active" id="optFile">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
      </svg>
      文件
    </button>
    <button class="scan-opt disabled" id="optUrl" title="当前版本仅支持文件扫描">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
      </svg>
      URL
    </button>
    <button class="scan-opt" id="optSearch" title="跳转到首页哈希搜索">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
      搜索
    </button>
  </div>

  <!-- ================= 大上传区 ================= -->
  <div class="upload-wrap" style="max-width:760px">
    <div class="dropzone large" id="dz">
      <div class="dz-icon">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
      </div>
      <div class="dz-main">将文件拖拽到此处开始扫描</div>
      <div class="dz-hint">或</div>
      <span class="dz-browse">选择文件</span>
      <div class="dz-format">支持任意类型 · 单文件最大 <b id="maxMb" style="color:var(--accent)">10</b> MB · 可多选 · 全程内存扫描不落盘</div>
      <input type="file" id="fi" multiple hidden>
    </div>
  </div>

  <!-- ================= 最近扫描历史 ================= -->
  <section class="recent" id="recent">
    <div class="recent-head">
      <h2>最近扫描</h2>
      <span class="recent-cnt" id="recentCnt"></span>
      <button class="recent-clear" id="recentClear">清空记录</button>
    </div>
    <div class="recent-list" id="recentList"></div>
  </section>

  <!-- ================= 结果区 ================= -->
  <div class="results-empty" id="emptyHint">选择或拖入文件后，扫描结果将显示在这里</div>
  <section class="results" id="results"></section>

  <footer>
    NKREPO Scanner · 参考 <a href="https://www.clamav.net" target="_blank">ClamAV</a> 签名格式 · 哈希 + YARA + PE 静态分析<br>
    界面风格参考 <a href="https://www.virustotal.com" target="_blank">VirusTotal</a> · 仅用于安全研究
  </footer>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
<script>
/* ================= 页面绑定 ================= */
const dz = document.getElementById('dz');
const fi = document.getElementById('fi');
const results = document.getElementById('results');
const emptyHint = document.getElementById('emptyHint');
const toastEl = document.getElementById('toast');

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* 上传事件 (完成/失败后记录最近扫描历史) */
function uploadFile(file) {
  upload(file, results, emptyHint, (card, d) => {
    addRecent({
      name: file.name,
      size: file.size,
      ts: Date.now(),
      verdict: d ? (d.clean ? 'clean' : 'detected') : 'error',
      sha256: d ? d.sha256 : null
    });
  });
}
dz.addEventListener('click', e => { if (e.target.id !== 'fi') fi.click(); });
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('over');
  [...e.dataTransfer.files].forEach(uploadFile);
});
fi.addEventListener('change', () => { [...fi.files].forEach(uploadFile); fi.value = ''; });

/* 扫描选项条 */
document.getElementById('optFile').addEventListener('click', () => {
  window.scrollTo({ top: dz.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
});
document.getElementById('optUrl').addEventListener('click', () => {
  toast('URL 扫描暂未开放：当前版本仅支持本地文件扫描');
});
document.getElementById('optSearch').addEventListener('click', () => { location.href = '/'; });

/* ================= 最近扫描历史 (localStorage) ================= */
const RECENT_KEY = 'nk_recent_scans';
const recentList = document.getElementById('recentList');
const recentCnt = document.getElementById('recentCnt');

function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch (e) { return []; }
}
function saveRecent(list) { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 10))); }
function addRecent(item) {
  const list = getRecent();
  list.unshift(item);
  saveRecent(list);
  renderRecent();
}
function delRecent(ts) {
  saveRecent(getRecent().filter(x => x.ts !== ts));
  renderRecent();
}
document.getElementById('recentClear').addEventListener('click', () => {
  saveRecent([]);
  renderRecent();
  toast('最近扫描记录已清空');
});

const RECENT_BADGE = {
  clean:    { text: '清洁',    cls: 'clean' },
  detected: { text: '已检测',  cls: 'detected' },
  error:    { text: '失败',    cls: 'error' },
  scanning: { text: '扫描中',  cls: 'error' }
};

function renderRecent() {
  const list = getRecent();
  recentCnt.textContent = list.length ? list.length + ' 条' : '';
  if (!list.length) {
    recentList.innerHTML = '<div class="recent-empty">暂无扫描记录 — 上传文件后会自动出现在这里</div>';
    return;
  }
  recentList.innerHTML = list.map(it => {
    const b = RECENT_BADGE[it.verdict] || RECENT_BADGE.error;
    const cls = it.verdict === 'clean' ? 'clean' : (it.verdict === 'detected' ? 'detected' : 'error');
    const time = new Date(it.ts).toLocaleString('zh-CN', { hour12: false });
    return '<div class="recent-item ' + cls + '" data-ts="' + it.ts + '">' +
      '<span class="ri-verdict"></span>' +
      '<span class="ri-icon">' + (ftCatIcons.other) + '</span>' +
      '<div class="ri-main">' +
        '<div class="ri-name">' + esc(it.name) + '</div>' +
        '<div class="ri-sub">' + (it.sha256 ? it.sha256 : '-') + ' · ' + fmtSize(it.size || 0) + ' · ' + time + '</div>' +
      '</div>' +
      '<span class="ri-badge">' + b.text + '</span>' +
      '<button class="ri-del" data-ts="' + it.ts + '" title="删除记录">\u00d7</button>' +
    '</div>';
  }).join('');

  recentList.querySelectorAll('.ri-del').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); delRecent(Number(btn.dataset.ts)); }));
  recentList.querySelectorAll('.recent-item').forEach(el =>
    el.addEventListener('click', () => {
      const it = getRecent().find(x => x.ts === Number(el.dataset.ts));
      if (it && it.sha256) {
        lookupHashCard(it.sha256, results, emptyHint, it.name);
        window.scrollTo({ top: results.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
      } else {
        toast('该记录没有 SHA256，无法重新查询');
      }
    }));
}

/* 引擎状态 */
loadStats();
renderRecent();
</script>
</body>
</html>
